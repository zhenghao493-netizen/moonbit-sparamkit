name: Cross-platform delivery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BROWSER_NAME: ${{ matrix.browser }}
      PYTHONUTF8: '0'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP\moon-install.ps1"
          & "$env:RUNNER_TEMP\moon-install.ps1"
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run Windows PowerShell core verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/verify.ps1
      - name: Build and inspect delivered files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          moon version --all > verification/platform-toolchain.log
          python -c 'import locale, sys; print("default encoding:", locale.getencoding(), "UTF8 mode:", sys.flags.utf8_mode)' | tee verification/platform-encoding.log
          moon build bridge --target js --release --deny-warn
          python tools/build_web.py
          python dist/verify_download.py | tee verification/download-check.log
          python tools/test_host.py | tee verification/platform-host.log
      - name: Rebuild source archive on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_package.py | tee verification/windows-package.log
      - name: Install test browser on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Install test browser on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Exercise actual offline HTML
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_browser.py | tee verification/platform-browser.log
          python tools/test_numeric_browser.py | tee verification/numeric-browser.log
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}-${{ matrix.browser }}
          path: verification/
          retention-days: 30
