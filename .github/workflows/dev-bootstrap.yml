name: Normalize reviewed source
on:
  push:
    branches: [hardening/compatibility-packaging]
    paths: [.github/workflows/dev-bootstrap.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: hardening/compatibility-packaging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official toolchain
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Normalize only MoonBit source and generated API on review branch
        run: |
          set -euo pipefail
          moon fmt
          moon info --target wasm-gc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.mbt' '*.mbti' moon.mod moon.pkg '*/moon.pkg'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format MoonBit sources and generate checked public interfaces'
            git push origin HEAD:hardening/compatibility-packaging
          fi
          git rev-parse HEAD
          git archive --format=tar.gz HEAD > /tmp/normalized-source.tar.gz
      - name: Check normalized source and fresh archive
        run: |
          set -euo pipefail
          bash tools/verify.sh
          python tools/check_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normalized-reviewed-source
          path: /tmp/normalized-source.tar.gz
          retention-days: 2
