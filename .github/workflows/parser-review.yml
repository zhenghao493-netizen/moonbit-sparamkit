name: Prepare current-upstream parser review
on:
  push:
    branches: [reselect/parser-conformance]
    paths: ['patches/current/**', 'regressions/**', 'tools/prepare_review.py', 'upstream.review.lock.json', '.github/workflows/parser-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moonbitlang/parser
          ref: c1174741f8fd5c9b827af7b9148884413e5ebfdd
          path: upstream
          persist-credentials: false
      - name: Install official toolchain
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify independent fixes and prepare replayable review commits
        run: python tools/prepare_review.py upstream
      - name: Retain current logs and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-current-review
          path: reports/current-review/
          retention-days: 30
