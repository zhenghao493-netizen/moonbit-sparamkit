name: Verify SParamKit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Verify (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          if ! curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 \
            https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh; then
            curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 \
              https://cli.moonbitlang.cn/install/unix.sh -o /tmp/install-moon.sh
          fi
          bash /tmp/install-moon.sh 2>&1 | tee verification/install.log
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build, test and run example
        run: bash tools/verify.sh "${{ matrix.target }}"
      - name: Retain verification logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.target }}
          path: verification/
          if-no-files-found: warn
          retention-days: 14
