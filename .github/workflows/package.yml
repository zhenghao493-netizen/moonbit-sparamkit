name: Package and clean-room verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify fresh source package without publishing
        run: python tools/check_package.py
      - name: Retain package result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification
          path: verification/package-check.json
          retention-days: 30
      - name: Upload verified source package
        uses: actions/upload-artifact@v4
        with:
          name: sparamkit-source-package
          path: _build/publish/*.zip
          if-no-files-found: error
          retention-days: 30
