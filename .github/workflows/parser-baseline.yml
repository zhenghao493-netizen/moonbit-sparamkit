name: Parser compatibility pilot
on:
  push:
    branches: [reselect/parser-conformance]
    paths: ['tools/**', 'fixtures/**', 'upstream.lock.json', '.github/workflows/parser-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moonbitlang/parser
          ref: a01fd77e599c12cf9a2182df3456990e74f53ced
          path: upstream
          persist-credentials: false
      - name: Install MoonBit and record environment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          mkdir -p reports
          "$HOME/.moon/bin/moon" version --all > reports/toolchain.log
      - name: Resolve pinned upstream dependencies
        working-directory: upstream
        run: moon update
      - name: Compare valid syntax with both parser implementations
        run: python tools/pilot.py upstream
      - name: Retain actual inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-pilot
          path: reports/
          retention-days: 14
