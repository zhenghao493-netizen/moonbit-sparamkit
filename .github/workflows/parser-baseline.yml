name: Parser topic baseline
on:
  push:
    branches: [reselect/parser-conformance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moonbitlang/parser
          ref: a01fd77e599c12cf9a2182df3456990e74f53ced
          path: upstream
          persist-credentials: false
      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Execute unchanged upstream baseline
        run: python tools/baseline.py upstream
      - name: Retain baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-baseline
          path: reports/
          retention-days: 14
      - name: Package pinned sources and resolved dependencies for local tests
        if: always()
        shell: bash
        run: |
          tar --exclude='.git' --exclude='_build' --exclude='target' --exclude='node_modules' -czf parser-workspace.tar.gz upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-workspace
          path: parser-workspace.tar.gz
          retention-days: 2
